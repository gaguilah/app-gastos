name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  estatica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  unitarias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  base-de-datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Solo Supabase local: este trabajo nunca se enlaza con el proyecto real.
      - run: npx supabase db start
      - run: npx supabase db reset
      - run: npx supabase db lint --fail-on error
      - run: npx supabase test db
      # Los tipos de src/datos/tipos.ts deben salir de las migraciones actuales.
      - name: Tipos generados al día
        run: |
          npm run db:types
          git diff --exit-code src/datos/tipos.ts || {
            echo "::error::src/datos/tipos.ts no está al día: corre npm run db:types y súbelo."
            exit 1
          }

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      # Login, recuperación (correo en Mailpit) y sesión contra Supabase local, con el
      # usuario de la semilla. Solo los servicios que usa la app.
      - run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,storage-api,postgres-meta
      - run: npm run e2e -- --trace off
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: informe-playwright
          path: playwright-report
          retention-days: 7
